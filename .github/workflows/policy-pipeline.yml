# ============================================================
# GitHub Actions — Policy-as-Code Pipeline (Framework Edition)
#
# Changes from v1:
#   - Gate 2: Removed custom OPA Rego evaluation
#   - Gate 2: Regula uses built-in CIS GCP framework rules
#   - Gate 2: Added Terrascan (OPA-native, CIS built-in)
#   - Gate 4: Cloud Custodian simplified (no Pub/Sub needed)
#   - All policy checks use zero custom-written policies
#
# Secrets required in GitHub → Settings → Secrets → Actions:
#   GCP_PROJECT_ID  : your GCP project ID
#   GCP_SA_KEY      : base64 of your service account JSON key
# ============================================================

name: Policy-as-Code Pipeline (Framework)

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policies/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION:      "1.7.0"
  REGULA_VERSION:  "3.2.1"
  WORKING_DIR:     ./terraform

jobs:

  # ═══════════════════════════════════════════════════════════
  # GATE 1 — Checkov Static Scan (CIS GCP Built-in Rules)
  # Scans Terraform HCL files — no GCP credentials required
  # Framework: CIS GCP Foundations Benchmark
  # ═══════════════════════════════════════════════════════════
  gate1-checkov:
    name: "Gate 1 — Checkov (CIS GCP Framework)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov — CIS GCP Benchmark
        run: |
          echo "════════════════════════════════════════════"
          echo "  Gate 1 — Checkov CIS GCP Framework Scan"
          echo "════════════════════════════════════════════"
          checkov \
            --directory ${{ env.WORKING_DIR }} \
            --framework terraform \
            --check CKV_GCP_88,CKV_GCP_28,CKV_GCP_29,CKV_GCP_32,CKV_GCP_35,CKV_GCP_38,CKV_GCP_39,CKV_GCP_40,CKV2_GCP_12 \
            --output cli \
            --output junitxml \
            --output-file-path . \
            --soft-fail
          echo ""
          echo "Checkov maps each finding to a CIS GCP control ID."
          echo "Remove --soft-fail above to hard-block the pipeline."

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate1-checkov-report
          path: results_junitxml.xml


  # ═══════════════════════════════════════════════════════════
  # GATE 2 — Terraform Plan + Framework Policy Evaluation
  #
  # 2a: Regula   — CIS GCP + NIST + PCI-DSS (built-in, 150+ rules)
  # 2b: Terrascan — CIS GCP via OPA (built-in, OPA-native)
  #
  # No custom Rego written. All rules from open frameworks.
  # ═══════════════════════════════════════════════════════════
  gate2-plan-and-policy:
    name: "Gate 2 — Plan + Regula + Terrascan (Framework)"
    runs-on: ubuntu-latest
    needs: gate1-checkov

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan → JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          echo "Plan JSON generated ($(wc -c < tfplan.json) bytes)"

      # ── Gate 2a: Regula — CIS GCP Built-in Framework ──────
      - name: Install Regula
        run: |
          curl -sL https://github.com/fugue/regula/releases/download/v${{ env.REGULA_VERSION }}/regula_${{ env.REGULA_VERSION }}_Linux_x86_64.tar.gz \
            | tar xz
          sudo mv regula /usr/local/bin/
          regula version

      - name: Run Regula — CIS GCP + NIST + PCI-DSS
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "════════════════════════════════════════════"
          echo "  Gate 2a — Regula Framework Evaluation"
          echo "  Rules: CIS GCP + NIST 800-53 + PCI-DSS"
          echo "  Source: fugue/regula built-in library"
          echo "════════════════════════════════════════════"
          regula run tfplan.json \
            --input-type tf-plan \
            --format table \
            --severity MEDIUM \
            || true

          echo ""
          echo "Key Regula rule IDs for this lab:"
          echo "  FG_R00379 → CIS GCP 3.6 → Firewall SSH from 0.0.0.0/0"
          echo "  FG_R00380 → CIS GCP 3.7 → Firewall RDP from 0.0.0.0/0"
          echo "  FG_R00357 → CIS GCP 5.1 → GCS bucket public access"
          echo "  FG_R00358 → CIS GCP 5.2 → GCS bucket logging"
          echo "  FG_R00410 → CIS GCP 4.4 → VM Shielded VM not enabled"
          echo "  FG_R00411 → CIS GCP 4.9 → VM has public IP"
          echo "  FG_R00412 → CIS GCP 4.1 → VM uses default SA"

      - name: Regula — Export JSON Results
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          regula run tfplan.json \
            --input-type tf-plan \
            --format json \
            --severity MEDIUM \
            > ../regula-results.json || true
          echo "Violations found: $(python3 -c "
          import json, sys
          d = json.load(open('../regula-results.json'))
          fails = [r for r in d.get('rule_results', []) if r.get('result') == 'FAIL']
          print(len(fails))
          " 2>/dev/null || echo 'unknown')"

      # ── Gate 2b: Terrascan — OPA-native, CIS GCP Built-in ─
      - name: Install Terrascan
        run: |
          curl -L "https://github.com/tenable/terrascan/releases/download/v1.19.1/terrascan_1.19.1_Linux_x86_64.tar.gz" \
            -o terrascan.tar.gz
          tar -xzf terrascan.tar.gz terrascan
          sudo mv terrascan /usr/local/bin/
          terrascan version

      - name: Run Terrascan — CIS GCP Policies (OPA-native)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "════════════════════════════════════════════"
          echo "  Gate 2b — Terrascan CIS GCP (OPA-native)"
          echo "  Policies: Built-in Rego, no custom rules"
          echo "════════════════════════════════════════════"
          terrascan scan \
            --iac-type terraform \
            --policy-type gcp \
            --verbose \
            || true

      - name: Upload Plan + Policy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2-plan-and-policy-results
          path: |
            ${{ env.WORKING_DIR }}/tfplan.json
            regula-results.json


  # ═══════════════════════════════════════════════════════════
  # GATE 3 — Terraform Apply
  # Only runs on push to main after Gates 1 + 2 pass
  # Requires manual approval (GitHub Environment: production)
  # ═══════════════════════════════════════════════════════════
  gate3-apply:
    name: "Gate 3 — Terraform Apply"
    runs-on: ubuntu-latest
    needs: [gate1-checkov, gate2-plan-and-policy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init + Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init
          terraform apply \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -auto-approve


  # ═══════════════════════════════════════════════════════════
  # GATE 4 — Cloud Custodian Live Scan (CIS GCP Policies)
  # Runs after apply — scans LIVE GCP resources
  # Results written to custodian-output/ directory
  # No Pub/Sub required — findings in output artifacts
  # ═══════════════════════════════════════════════════════════
  gate4-custodian:
    name: "Gate 4 — Cloud Custodian Live Scan (CIS GCP)"
    runs-on: ubuntu-latest
    needs: gate3-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Cloud Custodian GCP
        run: pip install c7n c7n-gcp

      - name: Run Cloud Custodian — CIS GCP Live Scan
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_PROJECT:        ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "════════════════════════════════════════════"
          echo "  Gate 4 — Cloud Custodian CIS GCP Live Scan"
          echo "════════════════════════════════════════════"
          custodian run \
            --configs policies/custodian/gcp-policies.yml \
            --output-dir ./custodian-output \
            2>&1 || true

      - name: Print Custodian Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  Cloud Custodian — Findings Summary"
          echo "════════════════════════════════════════════"
          find ./custodian-output -name "resources.json" | while read f; do
            POLICY=$(echo "$f" | awk -F'/' '{print $3}')
            COUNT=$(python3 -c "
          import json
          data = json.load(open('$f'))
          print(len(data))
            " 2>/dev/null || echo "0")
            if [ "$COUNT" -gt "0" ]; then
              echo "  ❌ $POLICY → $COUNT resource(s) flagged"
            else
              echo "  ✅ $POLICY → clean"
            fi
          done

      - name: Upload Custodian Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate4-custodian-findings
          path: custodian-output/
