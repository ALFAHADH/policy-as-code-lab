# ============================================================
# GitHub Actions — Policy-as-Code CI/CD Pipeline
#
# Triggers on:
#   - Pull Request (validation only — blocks merge)
#   - Push to main  (validation + terraform apply)
#
# Secrets to set in GitHub → Settings → Secrets:
#   GCP_PROJECT_ID        : your GCP project ID
#   GCP_SA_KEY            : base64 service account JSON key
#                           (generate: base64 -w0 sa-key.json)
# ============================================================

name: Policy-as-Code Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policies/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: "1.7.0"
  REGULA_VERSION: "3.2.1"
  OPA_VERSION: "0.63.0"
  WORKING_DIR: ./terraform

jobs:
  # ─────────────────────────────────────────
  # GATE 1: Checkov Static Scan
  # Runs CIS GCP benchmark + custom checks
  # ─────────────────────────────────────────
  checkov-scan:
    name: "Gate 1 — Checkov Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov against Terraform code
        id: checkov
        run: |
          checkov \
            --directory ${{ env.WORKING_DIR }} \
            --framework terraform \
            --check CKV_GCP_88,CKV_GCP_28,CKV_GCP_29,CKV_GCP_32,CKV_GCP_35,CKV_GCP_38,CKV_GCP_39,CKV_GCP_40,CKV2_GCP_12 \
            --output cli \
            --output junitxml \
            --output-file-path . \
            --soft-fail    # Remove --soft-fail to make this a hard block
        continue-on-error: true  # Remove this to hard-block PRs

      - name: Upload Checkov Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: results_junitxml.xml

  # ─────────────────────────────────────────
  # GATE 2: Terraform Plan + OPA Evaluation
  # Blocks apply if Rego policies fail
  # ─────────────────────────────────────────
  terraform-plan-opa:
    name: "Gate 2 — Terraform Plan + OPA Policy"
    runs-on: ubuntu-latest
    needs: checkov-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan → JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          echo "Terraform plan JSON generated."

      - name: Install OPA
        run: |
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/download/v${{ env.OPA_VERSION }}/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA Policy Evaluation
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "  OPA Policy Evaluation — GCP Security"
          echo "=========================================="

          # Evaluate deny rules (violations)
          VIOLATIONS=$(opa eval \
            --data ../policies/opa/gcp_security.rego \
            --input tfplan.json \
            --format pretty \
            "data.rules.gcp_security.deny")

          echo "$VIOLATIONS"

          # Count violations
          VIOLATION_COUNT=$(echo "$VIOLATIONS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(len(data))
          " 2>/dev/null || echo "0")

          echo ""
          echo "Total violations found: $VIOLATION_COUNT"

          # Evaluate warnings (non-blocking)
          echo ""
          echo "--- Policy Warnings ---"
          opa eval \
            --data ../policies/opa/gcp_security.rego \
            --input tfplan.json \
            --format pretty \
            "data.rules.gcp_security.warn" || true

          # Fail pipeline if violations found
          if [ "$VIOLATION_COUNT" -gt "0" ]; then
            echo ""
            echo "❌ PIPELINE BLOCKED: $VIOLATION_COUNT OPA policy violation(s) found."
            echo "Fix the violations above before applying infrastructure."
            exit 1
          else
            echo "✅ OPA policy check passed — no violations found."
          fi

      - name: Install Regula (extended CIS benchmark check)
        run: |
          curl -L https://github.com/fugue/regula/releases/download/v${{ env.REGULA_VERSION }}/regula_${{ env.REGULA_VERSION }}_Linux_x86_64.tar.gz \
            | tar xz
          sudo mv regula /usr/local/bin/

      - name: Run Regula (CIS GCP Benchmark)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "  Regula — CIS GCP Benchmark Evaluation"
          echo "=========================================="
          regula run tfplan.json \
            --input-type tf-plan \
            --format table \
            --severity HIGH \
            || true   # Remove '|| true' to hard-block on HIGH severity

      - name: Upload Plan + Policy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-policy-results
          path: |
            ${{ env.WORKING_DIR }}/tfplan.json

  # ─────────────────────────────────────────
  # GATE 3: Terraform Apply
  # Only runs on push to main, only if Gates 1+2 pass
  # ─────────────────────────────────────────
  terraform-apply:
    name: "Gate 3 — Terraform Apply"
    runs-on: ubuntu-latest
    needs: [checkov-scan, terraform-plan-opa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # Requires manual approval in GitHub Environments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init + Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init
          terraform apply \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -auto-approve

  # ─────────────────────────────────────────
  # GATE 4: Cloud Custodian Live Scan
  # Runs after apply to verify live resources
  # ─────────────────────────────────────────
  custodian-live-scan:
    name: "Gate 4 — Cloud Custodian Live Scan"
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Python + Cloud Custodian GCP
        run: |
          pip install c7n c7n-gcp

      - name: Run Cloud Custodian Policies
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "=========================================="
          echo "  Cloud Custodian — Live GCP Resource Scan"
          echo "=========================================="
          custodian run \
            --configs policies/custodian/gcp-policies.yml \
            --output-dir ./custodian-output \
            2>&1 || true

          echo ""
          echo "--- Custodian Scan Summary ---"
          find ./custodian-output -name "resources.json" | while read f; do
            POLICY=$(echo $f | awk -F'/' '{print $3}')
            COUNT=$(python3 -c "import json; d=json.load(open('$f')); print(len(d))" 2>/dev/null || echo "0")
            echo "Policy: $POLICY → $COUNT resource(s) flagged"
          done

      - name: Upload Custodian Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custodian-scan-results
          path: custodian-output/
